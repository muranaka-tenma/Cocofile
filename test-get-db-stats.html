<!DOCTYPE html>
<html>
<head>
    <title>Test getDatabaseStats</title>
    <script type="module">
        // This test file should be opened in the Tauri app's webview
        async function testGetDbStats() {
            console.log('Testing getDatabaseStats...');
            try {
                const { invoke } = window.__TAURI__.core;
                console.log('Tauri API available:', !!invoke);

                const result = await invoke('get_db_stats');
                console.log('✅ SUCCESS! Result:', result);
                document.getElementById('result').innerHTML = `
                    <div style="color: green;">
                        <h2>✅ Success!</h2>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                console.error('❌ ERROR:', error);
                document.getElementById('result').innerHTML = `
                    <div style="color: red;">
                        <h2>❌ Error!</h2>
                        <pre>${error}</pre>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, __TAURI__ available:', !!window.__TAURI__);
            document.getElementById('testBtn').addEventListener('click', testGetDbStats);
        });
    </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Test get_db_stats Command</h1>
    <button id="testBtn" style="padding: 10px 20px; font-size: 16px;">Test getDatabaseStats</button>
    <div id="result" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px;">
        Click the button to test...
    </div>
</body>
</html>
